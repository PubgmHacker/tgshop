  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #08080a;
      color: #f2f2f4;
      font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 28px 24px 8px;
      max-width: 1080px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.03em; }
    p { margin: 0; color: #8a8a96; }
    section {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 24px 32px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8a96;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 10px;
    }
    .grid.lg { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    figure {
      margin: 0;
      padding: 12px 8px 10px;
      background: #141418;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    figure img { display: block; image-rendering: auto; }
    figcaption {
      font-size: 10px;
      color: #8a8a96;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
